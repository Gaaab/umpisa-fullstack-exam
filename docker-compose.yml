services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskboard"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskboard
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --post-data='{\"query\":\"{health}\"}' --header='Content-Type: application/json' http://localhost:4000/graphql | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_WS_URL: ws://localhost:4000/graphql
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy


volumes:
  db-data:
